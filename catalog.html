<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta name="description" content="Каталог украшений Wild Rose Jewel. Ручная работа, натуральные камни, доставка по Казахстану и миру." data-i18n="meta_catalog">
    <title data-i18n="catalog_main_title">Каталог | Wild Rose Jewel</title>
    
    <!-- Подключаем премиальные шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    
    <!-- Стили -->
    <link rel="stylesheet" href="style.css?v=13.9">

    <!-- Скрипты -->
    <script defer src="translations.js"></script>
    <script defer src="utils.js"></script>
    <script defer src="components.js"></script>
    <script defer src="products-data.js?v=5"></script>
    <script defer src="script.js?v=5"></script>
</head>
<body class="catalog-page">

    <!-- Навигация -->
    <!-- Навигация (Загружается динамически) -->
    <header id="mainHeader"></header>

    <!-- Заголовок страницы -->
    <section class="page-header">
        <div class="container">
            <div class="section-title">
                <h1 data-i18n="catalog_main_title">Каталог украшений</h1>
            </div>
        </div>
    </section>

    <!-- Каталог -->
    <section class="catalog-section">
        <!-- Группа управления (Sticky на мобильных) -->
        <div class="catalog-controls">
            <div class="container">
                <!-- Сезоны -->
                <div class="season-filter">
                    <button class="season-btn" data-season="winter" data-i18n="season_winter">Зима</button>
                    <button class="season-btn active" data-season="spring" data-i18n="season_spring">Весна</button>
                    <button class="season-btn" data-season="summer" data-i18n="season_summer">Лето</button>
                    <button class="season-btn" data-season="autumn" data-i18n="season_autumn">Осень</button>
                    <button class="season-btn" data-season="symbol" data-i18n="season_symbol">Символы</button>
                </div>
 
                <!-- Поиск по каталогу -->
                <div class="search-bar-wrap">
                    <div class="search-input-box">
                        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" id="catalogSearchInput" class="catalog-search-input" placeholder="Поиск по названию или камню..." data-i18n="search_placeholder" autocomplete="off">
                        <button id="clearSearchBtn" class="clear-search-btn" aria-label="Очистить поиск" style="display:none;">&times;</button>
                    </div>
                </div>

                <!-- Быстрые фильтры по минералам и камням -->
                <div class="mineral-filter-bar">
                    <button class="mineral-chip active" data-mineral="" data-i18n="filter_mineral_all">Все камни</button>
                    <button class="mineral-chip" data-mineral="жемчуг" data-i18n="filter_mineral_pearl">Жемчуг</button>
                    <button class="mineral-chip" data-mineral="кварц" data-i18n="filter_mineral_quartz">Кварц & Лунный</button>
                    <button class="mineral-chip" data-mineral="агат" data-i18n="filter_mineral_amethyst">Аметист & Агат</button>
                </div>

                <!-- Фильтры категорий -->
                <div class="filter-bar">
                    <button class="filter-btn active" data-filter="all" data-i18n="filter_all">Все</button>
                    <button class="filter-btn" data-filter="necklaces" data-i18n="filter_necklaces">Колье</button>
                    <button class="filter-btn" data-filter="bracelets" data-i18n="filter_bracelets">Браслеты</button>
                    <button class="filter-btn" data-filter="earrings" data-i18n="filter_earrings">Серьги</button>
                    <button class="filter-btn" data-filter="rings" data-i18n="filter_rings">Кольца</button>
                    <button class="filter-btn" data-filter="sets" data-i18n="filter_sets">Комплекты</button>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="products-grid" id="productsGrid">
                <!-- Контент загружается динамически из products-data.js -->
            </div>
        </div>
    </section>

    <!-- Подвал (Footer) -->
    <!-- Подвал (Загружается динамически) -->
    <footer id="contacts"></footer>

    <!-- Скрипты (перенесены в head) -->

    <!-- Боковое меню (Загружается динамически) -->
    <div id="sidebarComponents"></div>
</body>
</html>
